# production settings

# no h2 console in production
spring.h2.console.enabled=false

# --- PostgreSQL datasource ---
spring.datasource.driverClassName=org.postgresql.Driver
# Datasource is configured via env vars injected by docker-compose:
#   SPRING_DATASOURCE_URL      -> spring.datasource.url
#   SPRING_DATASOURCE_USERNAME -> spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD -> spring.datasource.password
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-prod.sql
spring.jpa.defer-datasource-initialization=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
app.logging.path=/app
app.logging.application-file=application.log
app.logging.warn-error-file=warn-error.log

############### for prod #######################
# frontend served by backend; no cors calls expected; i.e. same origin expected
cors.allowed-origins=
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type
cors.allow-credentials=true
cors.max-age=1800


# Backend URL used when generating conf.yml for Pi devices
app.backend-url=${APP_BACKEND_URL}

# JWT Properties
# overridden via env var / deployment
app.jwt.secret=${APP_JWT_SECRET}
# 1h (for prod)
app.jwt.expirationMs=3600000
app.jwt.token.prefix=Bearer
app.jwt.token.header=Authorization
app.jwt.token.type=JWT
app.jwt.token.issuer=skel-api
app.jwt.token.audience=skel-ui
app.jwt.login.url=/authentication/login
