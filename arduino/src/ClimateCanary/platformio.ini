[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
lib_deps = 
	adafruit/Adafruit BME680 Library@^2.0.6
	seeed-studio/Grove - LCD RGB Backlight@^1.0.2
	arduino-libraries/ArduinoBLE @^1.2.0

